$ModLoad imtcp
$InputTCPServerRun 514

$ModLoad ommysql

# ============================================================
# DELPY
# ============================================================

# Raw Delpy log file
$template DelpyFile,"/var/log/delpy.log"

# Delpy SQL
$template DelpySQL,"insert into delpy (received_at,hostname,program,event_time,signature,sensitivity,host,srcip,file) values ('%timegenerated:::date-mysql%','%hostname%','%programname%','%msg:R,ERE,1:^ ([0-9][0-9]:[0-9][0-9]:[0-9][0-9])--end%','%msg:R,ERE,1:signature=(.*?) sensitivity=--end%','%msg:R,ERE,1:sensitivity=([^ ]+)--end%','%msg:R,ERE,1:host=([^ ]+)--end%','%msg:R,ERE,1:srcip=([^ ]+)--end%','%msg:R,ERE,1:file=(.*)--end%')",SQL

# Send Delpy to BOTH file and MySQL
if $programname == 'delpy' then ?DelpyFile
if $programname == 'delpy' then >localhost,NEST,root,1q2w3e4r5t!2;DelpySQL
if $programname == 'delpy' then stop


