# ============================================================
# SURICATA
# ============================================================

# Raw Suricata log
$template SuricataFile,"/var/log/suricata.log"

# ------------------------------------------------------------
# Suricata SQL
# ------------------------------------------------------------

$template SuricataSQL,"insert into Suricata (received_at,hostname,program,event_timestamp,flow_id,event_type,src_ip,src_port,dest_ip,dest_port,proto,signature_id,signature,category,severity,http_hostname,http_url,http_method,http_status) values ('%timegenerated:::date-mysql%','%hostname%','%programname%','%msg:R,ERE,1:\"timestamp\":\"([^\"]+)\"--end%','%msg:R,ERE,1:\"flow_id\":([0-9]+)--end%','%msg:R,ERE,1:\"event_type\":\"([^\"]+)\"--end%','%msg:R,ERE,1:\"src_ip\":\"([^\"]+)\"--end%','%msg:R,ERE,1:\"src_port\":([0-9]+)--end%','%msg:R,ERE,1:\"dest_ip\":\"([^\"]+)\"--end%','%msg:R,ERE,1:\"dest_port\":([0-9]+)--end%','%msg:R,ERE,1:\"proto\":\"([^\"]+)\"--end%','%msg:R,ERE,1:\"signature_id\":([0-9]+)--end%','%msg:R,ERE,1:\"signature\":\"([^\"]*)\"--end%','%msg:R,ERE,1:\"category\":\"([^\"]*)\"--end%','%msg:R,ERE,1:\"severity\":([0-9]+)--end%','%msg:R,ERE,1:\"hostname\":\"([^\"]*)\"--end%','%msg:R,ERE,1:\"url\":\"(.*)\"[[:space:]]*,\"http_user_agent\"--end%','%msg:R,ERE,1:\"http_method\":\"([^\"]*)\"--end%','%msg:R,ERE,1:\"status\":([0-9]+)--end%')",SQL

# ------------------------------------------------------------
# Suricata alert events -> raw file + MariaDB
# ------------------------------------------------------------

if $programname == 'Suricata' then ?SuricataFile
if $programname == 'Suricata' then >localhost,NEST,root,1q2w3e4r5t!2;SuricataSQL
if $programname == 'Suricata' then stop


